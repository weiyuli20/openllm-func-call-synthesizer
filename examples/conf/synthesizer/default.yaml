conversation_generation:
  enable: False
  input_file: null
  scenarios:
    - "Plan a three-day trip to Tokyo focused on food and museums."
    - "Help me compare two laptops for software development and travel."
  max_num: -1
  max_turns: 6
  output_dir: "data"
  name: "conversation_dataset"
  user_system_prompt: null
  assistant_system_prompt: null
  user_provider:
    model_name: "gpt-4o-mini"
    backend: "openai"
    generation_params:
      max_tokens: 512
  assistant_provider:
    model_name: "gpt-4o"
    backend: "openai"
    generation_params:
      max_tokens: 512

function_call_generation:
  enable: True
  function_dataset: "data/tool_query" #data set generated by query_generation
  max_num: -1 # max number of function calls to generate, -1 means all
  output_dir: "data"
  output_format: "jsonl"   # or "json", "csv", "parquet"
  name: "function_call_gpt_4o"
  provider:
    model_name: "qwen-plus"
    backend: "openai"
    backend_params:
      api_key: ${synthesizer.query_generation.providers.qwen.backend_params.api_key}
      base_url: "https://llm-mvatcq7dlr50w886.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
      require_all_responses: False
      max_tokens_per_minute: 1_000_000
    generation_params:
      max_tokens: 4096

tool_calling_conversation_generation:
  enable: False
  query_dataset: "data/tool_query"  # dataset produced by query_generation
  max_num: -1  # -1 means all queries
  max_iterations: 8  # max LLM calls per conversation before stopping
  system_prompt: >
    You are an assistant that completes requests using the available tools.
    Make only the minimum reasoning needed to choose the next tool and its arguments.
    Do not reveal or narrate your reasoning. Call tools directly and use their results
    to decide whether another tool call is needed. After all required tool calls are
    complete, give the user a concise, accurate answer based only on the tool results.
    Do not invent details that the tools did not return.
  output_dir: "data"
  name: "conversation_gpt_4o_mini"
  provider:
    model_name: "qwen3.6-flash"
    backend: "openai"
    backend_params:
      api_key: ${synthesizer.query_generation.providers.qwen.backend_params.api_key}
      base_url: "https://llm-mvatcq7dlr50w886.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
      require_all_responses: False
      max_tokens_per_minute: 1_000_000
    generation_params:
      max_tokens: 4096

critic:
  enable: True
  backend_type: "deepeval"
  function_call_dataset: "data/function_call_gpt_4o"
  output_dir: "data"
  # cirtic need 'query', 'label', 'task_prompt'
  query_field: "query"
  task_prompt_field: "prompt"
  label_field: "function_call"
  functions_field: "functions"
  response_field: "answer"
  output_format: "jsonl"   # or "json", "csv", "parquet"
  use_ground_truth: False # if True, ground_truth field is required
  threshold: 0.5
  async_config:
    run_async: True
    max_concurrent: 20
    throttle_value: 0
  name: "function_call_gpt_4o_critiqued_by_deepeval"
  provider:
    model_name: "openai/qwen3.8-max"
    backend: "openai"
    backend_params:
      api_key: ${synthesizer.query_generation.providers.qwen.backend_params.api_key}
      api_base: "https://llm-mvatcq7dlr50w886.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
      


llama_factory:
  # required fields： answer， query， functions
  enable: True
  critic_dataset: "data/function_call_gpt_4o_critiqued_by_deepeval"
  output_dir: "data"
  output_format: "jsonl"   # or "json", "csv", xlsx, "parquet"
  name: "function_call_gpt_4o_critiqued_by_deepeval_llama_factory"
  split_ratio: -1
  score_field: "score"
  score_threshold: 0.8
  system_prompt: "You are a helpful assistant."


verl:
  enable: True
  critic_dataset: "data/function_call_gpt_4o_critiqued_by_deepeval"
  output_dir: "data"
  output_format: "jsonl"
  name: "function_call_gpt_4o_critiqued_by_deepeval_verl"
  split_ratio: 0.85
  score_field: "score"
  score_threshold: 0.8
  system_prompt: "You are a helpful assistant."
